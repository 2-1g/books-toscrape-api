spring:
  application:
    name: jdbcpractice
  config:
    # Neon 접속 정보는 git에 올라가지 않는 application-secret.yaml에 둔다.
    import: optional:classpath:application-secret.yaml
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # 시작할 때 schema.sql 실행 (CREATE TABLE IF NOT EXISTS)
      mode: always
