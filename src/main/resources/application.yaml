spring:
  application:
    name: jdbcpractice
  config:
    # Neon 접속 정보는 git에 올라가지 않는 application-secret.yaml에 둔다.
    import: optional:classpath:application-secret.yaml
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
